<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carta para ti 💜</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2b0033,#6a1b9a,#a64ac9);
font-family:"Comic Sans MS",cursive;
}

.sobre{
position:relative;
width:320px;
height:200px;
background:#7b1fa2;
border-radius:10px;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.tapa{
position:absolute;
width:0;
height:0;
border-left:160px solid transparent;
border-right:160px solid transparent;
border-bottom:100px solid #9c27b0;
top:-100px;
transform-origin:bottom;
transition:0.8s;
}

.carta{
position:absolute;
width:270px;
background:white;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
transform:translateY(40px);
transition:0.8s;
}

.kuromi{
width:80px;
margin-bottom:10px;
}

h2{
color:#7b1fa2;
margin-top:5px;
}

#texto{
font-size:15px;
color:#333;
line-height:1.5;
white-space:pre-line;
}

.abrir .tapa{
transform:rotateX(180deg);
}

.abrir .carta{
transform:translateY(-160px);
}
</style>
</head>

<body>

<div class="sobre" onclick="abrirCarta()" id="sobre">

<div class="tapa"></div>

<div class="carta">

<img class="kuromi" src="https://i.pinimg.com/736x/89/55/15/895515efcb40a13c2b81c1fc0924fbb4.jpg">

<h2>Para ti 💜</h2>

<p id="texto"></p>

</div>

</div>

<script>

const mensaje = `Hola niña bonita, espero estés teniendo un lindo día.

Quería preguntarte si me darías una chance de invitarte a desayunar este lunes, como no tengo clases. La verdad me gustaría mucho pasar un ratito contigo, platicar.

Podríamos ir por unos taquitos de birria o algo que a ti te guste, tú escoges 🌮

Si tienes tiempo ese día me haría muy feliz que aceptaras.`;

let i = 0;

function escribir(){
if(i < mensaje.length){
document.getElementById("texto").innerHTML += mensaje.charAt(i);
i++;
setTimeout(escribir,35);
}
}

function abrirCarta(){
document.getElementById("sobre").classList.toggle("abrir");
setTimeout(escribir,700);
}

</script>

</body>
</html>
